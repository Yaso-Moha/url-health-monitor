services:

  backend:
    build:
      context: ./backend

    container_name: url-monitor-api

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npm run dev

    restart: unless-stopped

    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine

    container_name: url-monitor-db

    environment:
      POSTGRES_DB: url_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"
      

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped

volumes:
  postgres_data:
  