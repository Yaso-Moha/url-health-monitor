services:
  frontend:
    build:
      context: ./frontend

    container_name: url-monitor-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_BASE_URL: http://localhost:3000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0

    restart: unless-stopped

    depends_on:
      - backend

  backend:
    build:
      context: ./backend

    container_name: url-monitor-api

    ports:
      - "3000:3000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_monitor
      DB_USER: postgres
      DB_PASSWORD: password
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npm run dev

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine

    container_name: url-monitor-db

    environment:
      POSTGRES_DB: url_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5


    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped

volumes:
  postgres_data:
  
